<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreemer - Turn tours into bookings</title>
    <meta name="description" content="Dreemer shows a touring couple realistic images and a short reel of themselves getting married at your venue, so more tours turn into booked dates." />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Dreemer" />
    <meta property="og:title" content="Dreemer - Turn tours into bookings" />
    <meta property="og:description" content="The couple sees themselves married in your space right after the tour, shares it with family, and is more likely to book." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:title" content="Dreemer - Turn tours into bookings" />
    <meta name="twitter:description" content="Realistic AI previews and a short reel of each touring couple, married at your venue." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E9E6DB" />
    <!--
      Display and body faces are self-hosted (public/fonts, latin subsets of the
      same Outfit and Figtree variable fonts lib/brand names) so the first paint
      never waits on a third-party stylesheet. @font-face lives in src/index.css.
      The API server injects <meta name="dreemer-public-config"> and, on "/",
      the hero image preload into this head at request time.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin-variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/figtree-latin-variable.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
