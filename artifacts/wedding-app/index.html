<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreemer — The visual sales platform for venues</title>
    <meta name="description" content="Turn venue interest into booking intent. Personalized AI galleries, engagement tracking and a direct path to your date enquiry." />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Dreemer" />
    <meta property="og:title" content="Dreemer — The visual sales platform for venues" />
    <meta property="og:description" content="Create a more compelling venue sales experience with personalized visuals and measurable engagement." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:title" content="Dreemer — The visual sales platform for venues" />
    <meta name="twitter:description" content="Visual sales software for venues. Personalized previews. Engagement signals. Your next booking conversation." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#EFF5F5" />
    <!--
      Display and body faces are self-hosted (public/fonts, latin subsets of the
      same Syne and Manrope variable fonts lib/brand names) so the first paint
      never waits on a third-party stylesheet. @font-face lives in src/index.css.
      The API server injects <meta name="dreemer-public-config"> and, on "/",
      the hero image preload into this head at request time.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/syne-variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-variable.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
