name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pnpm's own setting (pnpm-workspace.yaml minimumReleaseAge) already guards
  # against brand-new releases; CI never needs a browser download.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  CI: "true"

jobs:
  verify:
    name: Typecheck, test, codegen drift, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Reject UTF-8 BOMs in tracked files
        run: |
          git ls-files -z | node -e '
            const fs = require("fs");
            const files = fs.readFileSync(0, "utf8").split("\0").filter(Boolean);
            const bad = [];
            for (const f of files) {
              let fd;
              try {
                fd = fs.openSync(f, "r");
                const b = Buffer.alloc(3);
                const n = fs.readSync(fd, b, 0, 3, 0);
                if (n === 3 && b[0] === 0xef && b[1] === 0xbb && b[2] === 0xbf) bad.push(f);
              } catch {
                // directories (submodules) and unreadable paths are not text files
              } finally {
                if (fd !== undefined) fs.closeSync(fd);
              }
            }
            if (bad.length) {
              console.error("Files start with a UTF-8 BOM:\n  " + bad.join("\n  "));
              process.exit(1);
            }
            console.log(`No BOM in ${files.length} tracked files.`);
          '

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Security smoke
        run: pnpm run smoke:security

      - name: Brand token tests
        run: pnpm --filter @workspace/brand run test

      - name: Codegen drift (OpenAPI -> generated clients)
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git status --porcelain -- lib/api-client-react/src/generated lib/api-zod/src/generated
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated
          if [ -n "$(git status --porcelain -- lib/api-client-react/src/generated lib/api-zod/src/generated)" ]; then
            echo "Generated API clients are out of date. Run: pnpm --filter @workspace/api-spec run codegen" >&2
            exit 1
          fi

      - name: Build
        run: pnpm run build

      - name: Brand tokens drift (tokens.css is generated by the brand build)
        run: |
          git diff --exit-code -- lib/brand/tokens.css || {
            echo "lib/brand/tokens.css is out of date. Run: pnpm --filter @workspace/brand run build" >&2
            exit 1
          }
