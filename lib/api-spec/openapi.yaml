      summary: Add an operator-verified venue fact with its source URL
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddControlProspectFactBody"
      responses:
        "201":
          description: Evidence after adding the fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlProspectEvidenceResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Prospect not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/prospects/{id}/facts/{factId}:
    delete:
      operationId: removeControlProspectFact
      tags: [control-plane]
      summary: Remove a fact so the copywriter can no longer cite it
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: factId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Evidence after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlProspectEvidenceResponse"
        "404":
          description: Prospect or fact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/outreach/sending:
    get:
      operationId: getControlOutreachSending
      tags: [control-plane]
      summary: Deliverability guard, daily cap, and 14-day sending health for prospect outreach
      responses:
        "200":
          description: Sending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlOutreachSendingState"
    post:
      operationId: setControlOutreachSending
      tags: [control-plane]
      summary: Pause or reset the deliverability guard (reset is always manual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetControlOutreachSendingBody"
      responses:
        "200":
          description: Sending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlOutreachSendingState"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /control/growth:
    get:
      operationId: getControlGrowth
      tags: [control-plane]
      summary: Outcome KPIs, adaptation state, copy variants, recent rule firings, latest digest
      responses:
        "200":
          description: Growth loop state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlGrowthResponse"

  /control/growth/recompute:
    post:
      operationId: recomputeControlGrowth
      tags: [control-plane]
      summary: Take a fresh KPI snapshot now (also runs the experiment evaluator and adaptation rules)
      responses:
        "200":
          description: Snapshot taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlGrowthResponse"

  /control/growth/variants/{key}:
    post:
      operationId: updateControlCopyVariant
      tags: [control-plane]
      summary: Pause, resume, reweight or reword a copy variant
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlCopyVariantUpdateBody"
      responses:
        "200":
          description: Updated variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlCopyVariantResponse"
        "404":
          description: Variant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The control variant cannot be deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/growth/guard/reset:
    post:
      operationId: resetControlDeliverabilityGuard
      tags: [control-plane]
      summary: Operator resets the deliverability guard to ok and restores the base daily cap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlGuardResetBody"
      responses:
        "200":
          description: Guard reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlGrowthResponse"

  /control/experiments/{id}:
    post:
      operationId: updateControlExperiment
      tags: [control-plane]
      summary: Edit card fields while proposed or running; start a proposed experiment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlExperimentUpdateBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlExperimentResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Experiment is not editable in its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/experiments/{id}/evaluate:
    post:
      operationId: evaluateControlExperiment
      tags: [control-plane]
      summary: Run the deterministic evaluator now without deciding
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlExperimentEvaluationResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/experiments/{id}/decision:
    post:
      operationId: decideControlExperiment
      tags: [control-plane]
      summary: Operator decision (win, kill, inconclusive, or extend the decision date)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlExperimentDecisionBody"
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlExperimentResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Only running experiments can be decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/digest/generate:
    post:
      operationId: generateControlDigest
      tags: [control-plane]
      summary: Build (or rebuild) this week's digest now and queue the send action
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlDigestGenerateBody"
      responses:
        "201":
          description: Digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlDigestResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required: [env, database, storage, ai, billing, email, qualityGate, imageModel, ffmpeg]
          additionalProperties: false
          properties:
            env:
              $ref: "#/components/schemas/ReadinessCheckState"
            database:
              $ref: "#/components/schemas/ReadinessCheckState"
            storage:
              $ref: "#/components/schemas/ReadinessCheckState"
            ai:
              $ref: "#/components/schemas/ReadinessCheckState"
            billing:
              $ref: "#/components/schemas/ReadinessCheckState"
            email:
              $ref: "#/components/schemas/ReadinessCheckState"
            qualityGate:
              $ref: "#/components/schemas/ReadinessCheckState"
            imageModel:
              $ref: "#/components/schemas/ReadinessCheckState"
            ffmpeg:
              $ref: "#/components/schemas/ReadinessCheckState"
            auth:
              $ref: "#/components/schemas/ReadinessCheckState"
            rls:
              $ref: "#/components/schemas/ReadinessCheckState"
        details:
          type: object
          description: >-
            Reasons per check (operators or x-readiness-token only). Keys are
            check names (env, auth, database, rls); values are human-readable
            reasons, empty when the check is ok.
          additionalProperties:
            type: array
            items:
              type: string

    ReadinessCheckState:
      type: string
      enum: [ok, degraded]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable reason, e.g. trial_expired, insufficient_credits, no_active_organization.

    CreateVenueBody:
      type: object
      required: [name, slug, ownerEmail]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9-]+$"
        tagline:
          type: string
        description:
          type: string
        ownerEmail:
          type: string
          format: email
          description: Email of the venue owner for secure login links and notifications.
        contactEmail:
          type: string
          format: email
          description: Optional public inquiry email shown to couples.
        contactPhone:
          type: string
          description: Optional public phone number shown to couples.
        websiteUrl:
          type: string
          format: uri
          description: Optional public venue website URL.
        bookingUrl:
          type: string
          format: uri
          description: Optional public tour booking URL.

    VenueResponse:
      type: object
      required: [id, name, slug, plan, creditsBalance, reviewBeforeSend, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        tagline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        ownerEmail:
          type: string
          format: email
          nullable: true
          description: Owner contact email (only returned on owner-session protected responses).
        contactEmail:
          type: string
          nullable: true
          description: Public inquiry email shown to couples.
        contactPhone:
          type: string
          nullable: true
          description: Public phone number shown to couples.
        websiteUrl:
          type: string
          nullable: true
          description: Public venue website URL.
        bookingUrl:
          type: string
          nullable: true
          description: Public tour booking URL.
        incentiveText:
          type: string
          nullable: true
          description: One line shown under the reel on the share page.
        tourCardDownloadedAt:
          type: string
          format: date-time
          nullable: true
        websiteImportedAt:
          type: string
          format: date-time
          nullable: true
        reviewBeforeSend:
          type: boolean
          description: >-
            When true, ready galleries wait in the dashboard for the venue to
            send them; when false (default) they are emailed to the couple
            automatically.
        organizationId:
          type: integer
          nullable: true
          description: Billing organization that owns this venue.
        plan:
          type: string
          enum: [trial, starter, growth, payg, none]
          description: Organization plan (billing lives on the organization).
        creditsBalance:
          type: integer
          description: Organization credit balance (shared across the org's venues).
        billingPeriodEnd:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    BillingCheckoutBody:
      type: object
      required: [product]
      properties:
        product:
          type: string
          enum: [starter, growth, credit_pack]

    BillingCheckoutResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

    BillingCheckoutConflictResponse:
      type: object
      required: [error, code, url]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [subscription_exists]
        url:
          type: string
          format: uri
          description: Stripe portal session (flow subscription_update) where the plan can be changed.

    BillingPortalResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

    UpdateVenueBody:
      type: object
      description: |
        All fields optional. Only the provided fields are updated.
        Slug is intentionally not editable to keep public URLs stable.
      properties:
        name:
          type: string
          minLength: 1
        tagline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        ownerEmail:
          type: string
          format: email
          description: Owner email for secure login links and notifications. Cannot be cleared.
        contactEmail:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        bookingUrl:
          type: string
          nullable: true
        incentiveText:
          type: string
          nullable: true
          maxLength: 160
          description: One line shown under the reel on the share page. Null clears it.
        reviewBeforeSend:
          type: boolean
          description: Hold ready galleries for the venue to review and send instead of emailing couples automatically.

    OrganizationResponse:
      type: object
      required: [organization, venues]
      properties:
        organization:
          type: object
          required: [id, name, plan, creditsBalance, clerkOrgId, trial, shareAggregates]
          properties:
            id:
              type: integer
            name:
              type: string
            plan:
              type: string
              enum: [trial, starter, growth, payg, none]
            creditsBalance:
              type: integer
            billingPeriodEnd:
              type: string
              format: date-time
              nullable: true
            clerkOrgId:
              type: string
            contactEmail:
              type: string
              nullable: true
            firstPaidAt:
              type: string
              format: date-time
              nullable: true
            churnedAt:
              type: string
              format: date-time
              nullable: true
            shareAggregates:
              type: boolean
              description: Venue opted in to anonymised aggregate proof on the public site.
            trial:
              $ref: "#/components/schemas/TrialState"
            role:
              type: string
              nullable: true
              description: Caller's Clerk role in this organization (e.g. org:admin).
            billingConfigured:
              type: boolean
              description: Whether Stripe billing is configured on this server.
            subscriptionStatus:
              type: string
              nullable: true
              enum: [active, past_due, canceled, paused]
              description: Stripe subscription status; null without a subscription.
            cancelAtPeriodEnd:
              type: boolean
              description: The subscription is set to end at the close of the current period.
        venues:
          type: array
          items:
            type: object
            required: [id, name, slug, createdAt]
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
              tagline:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time

    OrgCreditHistoryResponse:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            type: object
            required: [id, delta, reason, createdAt]
            properties:
              id:
                type: integer
              delta:
                type: integer
              reason:
                type: string
              venueId:
                type: integer
                nullable: true
              sessionId:
                type: integer
                nullable: true
              createdAt:
                type: string
                format: date-time

    VenuePublicResponse:
      type: object
      required: [id, name, slug, media, isReady, bookingReady, turnstileSiteKey, missingCoverages, reviewBeforeSend]
      description: Couple-facing venue profile. Never exposes billing or credit balances.
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        tagline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
          description: Public inquiry email shown to couples.
        contactPhone:
          type: string
          nullable: true
          description: Public phone number shown to couples.
        websiteUrl:
          type: string
          nullable: true
          description: Public venue website URL.
        bookingUrl:
          type: string
          nullable: true
          description: Public tour booking URL.
        createdAt:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: "#/components/schemas/VenueMediaItem"
        isReady:
          type: boolean
          description: >-
            True when the venue has enough reference photography for couples to
            start a gallery (the server's session-create guard applies the same
            rule). Couple-facing surfaces must use this flag instead of
            counting media themselves.
        bookingReady:
          type: boolean
          description: True when the venue has a booking URL, website, or contact email the share-page date CTA can use.
        turnstileSiteKey:
          type: string
          nullable: true
          description: Cloudflare Turnstile site key when bot protection is enabled on session creation; null otherwise.
        missingCoverages:
          type: array
          description: Coverage roles the venue still lacks reference photos for (empty when ready).
          items:
            $ref: "#/components/schemas/VenueMediaCoverage"
        incentiveText:
          type: string
          nullable: true
          description: One line the venue shows under the reel on the share page.
        reviewBeforeSend:
          type: boolean
          description: >-
            True when the venue reviews each gallery before it is emailed to the
            couple; false when galleries are emailed automatically once ready.
        uploadToken:
          type: string
          description: Short-lived venue-scoped token required for couple photo upload URL requests.

    VenueMediaItem:
      type: object
      required: [id, venueId, objectKey, coverage, displayOrder, createdAt]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        objectKey:
          type: string
        coverage:
          $ref: "#/components/schemas/VenueMediaCoverage"
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time

    VenueMediaCoverage:
      type: string
      enum: [exterior, ceremony, reception, detail, natural_light]
      description: Coverage role of the venue reference photo for scene-specific generation.

    ListVenueMediaResponse:
      type: object
      required: [media]
      properties:
        media:
          type: array
          items:
            $ref: "#/components/schemas/VenueMediaItem"

    AddVenueMediaBody:
      type: object
      required: [objectKey, coverage]
      properties:
        objectKey:
          type: string
        coverage:
          $ref: "#/components/schemas/VenueMediaCoverage"
        displayOrder:
          type: integer

    VenueDashboardResponse:
      type: object
      required: [venue, sessions]
      properties:
        venue:
          $ref: "#/components/schemas/VenueResponse"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"

    CreateSessionBody:
      type: object
      required: [couplePhotoKeys, coupleEmail]
      properties:
        couplePhotoKeys:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 3
        styleId:
          type: string
          description: ID of the desired gallery style. If omitted, the default style is used.
        coupleName:
          type: string
          description: Name of the couple. Optional.
        coupleEmail:
          type: string
          format: email
          description: Required. Used for recovery emails and notifications.
        turnstileToken:
          type: string
          description: Cloudflare Turnstile response token. Verified only when TURNSTILE_SECRET_KEY is set on the server.
        weddingMonth:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          description: The month the couple is thinking of, "YYYY-MM". Passed to the venue's date CTA.
        consent:
          type: boolean
          description: Both partners agree to the AI preview and photo handling. The server rejects couple sessions without it.
        createdVia:
          type: string
          enum: [couple_link, tour_day]
          description: couple_link (default) or tour_day when a coordinator starts it for the couple.

    GalleryStyleSummary:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    ListGalleryStylesResponse:
      type: object
      required: [styles]
      properties:
        styles:
          type: array
          items:
            $ref: "#/components/schemas/GalleryStyleSummary"

    SessionResponse:
      type: object
      required: [id, venueId, status, shareToken, createdAt]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        status:
          type: string
          enum: [pending, processing, ready, failed]
        shareToken:
          type: string
          description: Unguessable token used by the couple to view and share the session. Treat this like a password.
        createdAt:
          type: string
          format: date-time

    SessionSummary:
      type: object
      required: [id, venueId, status, createdAt, kind, createdVia, viewCount, sharedCount, ctaClicks]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        status:
          type: string
          enum: [pending, processing, ready, failed]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        thumbnailObjectKey:
          type: string
          nullable: true
        coupleName:
          type: string
          nullable: true
        coupleEmail:
          type: string
          nullable: true
        shareToken:
          type: string
          nullable: true
        kind:
          type: string
          enum: [couple, sample]
        createdVia:
          type: string
          enum: [couple_link, tour_day, sample]
        weddingMonth:
          type: string
          nullable: true
        emailedAt:
          type: string
          format: date-time
          nullable: true
          description: First "sent" gallery event.
        firstViewedAt:
          type: string
          format: date-time
          nullable: true
        viewCount:
          type: integer
        sharedCount:
          type: integer
        ctaClicks:
          type: integer
        bookedAt:
          type: string
          format: date-time
          nullable: true

    SendSessionEmailBody:
      type: object
      properties:
        email:
          type: string
          description: Override recipient email. Uses session coupleEmail if omitted. Owner-only.

    SendSessionEmailByTokenBody:
      type: object
      properties:
        email:
          type: string
          description: |
            Recipient email. Only honored when the session has no email on file
            yet (first-time capture) or when the value matches the email already
            captured on the session.

    SendSessionEmailResponse:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean

    DeleteSessionResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean

    RecoverSessionsBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email to look up. Server emails a magic-link list if sessions exist.

    RecoverSessionsResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: Always true for valid emails. Server intentionally does not reveal whether the email is on file.

    SessionDetailResponse:
      type: object
      required: [id, venueId, status, createdAt, generatedAssets, kind, createdVia]
      description: Public/couple-facing session view. Intentionally omits PII like coupleEmail.
      properties:
        id:
          type: integer
        venueId:
          type: integer
        status:
          type: string
          enum: [pending, processing, ready, failed]
        errorMessage:
          type: string
          nullable: true
        styleId:
          type: string
          nullable: true
        coupleName:
          type: string
          nullable: true
        hasCoupleEmail:
          type: boolean
          description: True if an email is on file. The email itself is never returned to non-owners.
        shareToken:
          type: string
          nullable: true
        kind:
          type: string
          enum: [couple, sample]
        createdVia:
          type: string
          enum: [couple_link, tour_day, sample]
        weddingMonth:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        venue:
          $ref: "#/components/schemas/VenuePublicResponse"
        generatedAssets:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedAsset"
        deliveryHeld:
          type: boolean
          description: >-
            True while a ready gallery waits for the venue's review (review
            before send, or a frame the quality check could not judge). The
            share link serves no assets until the owner sends it.

    OwnerSessionDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SessionDetailResponse"
        - type: object
          description: Owner-only session detail. Includes couple contact data for that venue owner.
          required: [viewCount, ctaClicks]
          properties:
            coupleEmail:
              type: string
              nullable: true
              description: Couple email on file. Only returned from owner-session protected endpoints.
            viewCount:
              type: integer
            ctaClicks:
              type: integer
            firstViewedAt:
              type: string
