    ControlCopyVariant:
      type: object
      required: [id, key, name, angle, defaultAsk, isControl, active, weight, pausedReason, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        angle: { type: string }
        defaultAsk: { type: string, enum: [preview, call] }
        isControl: { type: boolean }
        active: { type: boolean }
        weight: { type: number }
        pausedReason: { type: string, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ControlCopyVariantUpdateBody:
      type: object
      properties:
        active: { type: boolean }
        weight: { type: number, minimum: 0, maximum: 1 }
        angle: { type: string, minLength: 20, maxLength: 600 }
        name: { type: string, minLength: 3, maxLength: 80 }

    ControlCopyVariantResponse:
      type: object
      required: [variant]
      properties:
        variant: { $ref: "#/components/schemas/ControlCopyVariant" }

    ControlAdaptation:
      type: object
      required: [id, ruleKey, subjectType, subjectId, action, before, after, reason, snapshotId, createdAt]
      properties:
        id: { type: integer }
        ruleKey: { type: string }
        subjectType: { type: string }
        subjectId: { type: string, nullable: true }
        action: { type: string }
        before: { type: object, additionalProperties: true, nullable: true }
        after: { type: object, additionalProperties: true, nullable: true }
        reason: { type: string }
        snapshotId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    ControlGuardResetBody:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 5, maxLength: 400 }

    ControlMetricKey:
      type: object
      required: [key, label, unit, direction, supportsSegment, supportsVariant]
      properties:
        key: { type: string }
        label: { type: string }
        unit: { type: string, enum: [rate, hours, cents, count] }
        direction: { type: string, enum: [higher, lower] }
        supportsSegment: { type: boolean }
        supportsVariant: { type: boolean }

    ControlDigest:
      type: object
      required: [id, weekStart, document, polishedBy, actionId, sentTo, sentAt, createdBy, createdAt, html]
      properties:
        id: { type: integer }
        weekStart: { type: string, format: date-time }
        document: { type: object, additionalProperties: true }
        polishedBy: { type: string, nullable: true }
        actionId: { type: integer, nullable: true }
        sentTo:
          type: array
          nullable: true
          items: { type: string }
        sentAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        html: { type: string, description: Rendered email HTML for the sandboxed preview iframe }

    ControlDigestResponse:
      type: object
      required: [digest]
      properties:
        digest: { $ref: "#/components/schemas/ControlDigest" }

    ControlDigestGenerateBody:
      type: object
      properties:
        force: { type: boolean }

    ControlGrowthResponse:
      type: object
      required: [snapshotId, computedAt, kpis, guidance, variants, adaptations, metricKeys, loopEnabled, latestDigest]
      properties:
        snapshotId: { type: integer, nullable: true }
        computedAt: { type: string, format: date-time }
        kpis: { $ref: "#/components/schemas/GrowthKpis" }
        guidance: { $ref: "#/components/schemas/ControlSegmentGuidance" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/GrowthVariantStat" }
        adaptations:
          type: array
          items: { $ref: "#/components/schemas/ControlAdaptation" }
        metricKeys:
          type: array
          items: { $ref: "#/components/schemas/ControlMetricKey" }
        loopEnabled: { type: boolean }
        latestDigest:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ControlDigest"

    ControlExperimentCreateBody:
      type: object
      required: [name, hypothesis, metric, primaryMetricKey, minDetectableLift, decisionDate]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        hypothesis: { type: string, minLength: 10, maxLength: 1000 }
        metric: { type: string, minLength: 3, maxLength: 200 }
        primaryMetricKey: { type: string }
        segment: { type: string, nullable: true }
        variantKey: { type: string, nullable: true }
        baseline: { type: number, nullable: true }
        minDetectableLift: { type: number, exclusiveMinimum: 0, maximum: 5 }
        killThreshold: { type: number, nullable: true }
        decisionDate: { type: string, format: date-time }
        assignments: { type: object, additionalProperties: true, nullable: true }
        startNow: { type: boolean }

    ControlExperimentUpdateBody:
      type: object
      properties:
        hypothesis: { type: string, minLength: 10, maxLength: 1000 }
        segment: { type: string, nullable: true }
        variantKey: { type: string, nullable: true }
        baseline: { type: number, nullable: true }
        minDetectableLift: { type: number, exclusiveMinimum: 0, maximum: 5 }
        killThreshold: { type: number, nullable: true }
        decisionDate: { type: string, format: date-time }
        assignments: { type: object, additionalProperties: true, nullable: true }
        status: { type: string, enum: [running] }

    ControlExperimentDecisionBody:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [win, kill, inconclusive, extended] }
        note: { type: string, maxLength: 1000 }
        newDecisionDate: { type: string, format: date-time }

    ControlExperimentResponse:
      type: object
      required: [experiment]
      properties:
        experiment: { $ref: "#/components/schemas/ControlExperiment" }

    ControlExperimentEvaluation:
      type: object
      required: [decision, observedValue, n, baseline, target, requiredN, underpowered, reason, evaluatedAt]
      properties:
        decision: { type: string, enum: [continue, win, kill, inconclusive, not_measurable] }
        observedValue: { type: number, nullable: true }
        n: { type: integer }
        baseline: { type: number, nullable: true }
        target: { type: number, nullable: true }
        requiredN: { type: integer, nullable: true }
        underpowered: { type: boolean }
        reason: { type: string }
        evaluatedAt: { type: string, format: date-time }

    ControlExperimentEvaluationResponse:
      type: object
      required: [experiment, evaluation]
      properties:
        experiment: { $ref: "#/components/schemas/ControlExperiment" }
        evaluation: { $ref: "#/components/schemas/ControlExperimentEvaluation" }

    # ----- funnel events / claim links -----
    FunnelEventBody:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum:
            [
              landing_view,
              cta_click,
              signup_started,
              signup_completed,
              org_created,
              venue_created,
              first_photo,
              venue_ready,
              first_gallery,
              checkout_started,
              checkout_completed,
              credits_exhausted,
              tour_card_downloaded,
            ]
        properties:
          type: object
          additionalProperties: true
        source:
          type: string
          maxLength: 80

    FunnelEventResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean

    OutreachClaimResponse:
      type: object
      required: [venueName, website, region, photoUrls, prospectId]
      properties:
        venueName:
          type: string
        website:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        photoUrls:
          type: array
          items:
            type: string
        prospectId:
          type: integer
