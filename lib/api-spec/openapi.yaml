openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: venues
    description: Venue management
  - name: sessions
    description: Couple photo sessions
  - name: storage
    description: Object storage upload and serving endpoints
  - name: organization
    description: |
      Organization-level account and billing. Auth is a Clerk session; billing
      is Stripe at the organization level (subscriptions + credit packs), with
      credits granted by the Stripe webhook. One organization owns many venues.
  - name: control-plane
    description: |
      Autonomous Business Control Plane. A multi-agent operating system
      (growth, support, product, finance, experiments, sales, activation,
      governance) runs the business on a schedule; operators supervise it here:
      trigger/pause agents, approve or reject governed actions, work agent
      tasks, and audit everything. Auth is a Clerk session whose email is in
      CONTROL_PLANE_OPERATOR_EMAILS.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Returns non-secret production readiness checks for deploy monitors.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /venues:
    get:
      operationId: listVenues
      tags: [venues]
      summary: Deprecated public venue directory
      deprecated: true
      responses:
        "404":
          description: Directory disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createVenue
      tags: [venues]
      summary: Create a new venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueBody"
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get a venue by slug (public)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Venue found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePublicResponse"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateVenue
      tags: [venues]
      summary: Update venue profile (owner session)
      description: |
        Owner-only. Updates the public-facing venue profile fields. The slug
        cannot be changed (it is the public URL handle and would break QR codes
        and shared links). Owner email updates require an active owner session.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueBody"
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /org:
    get:
      operationId: getOrganization
      tags: [organization]
      summary: Get the caller's organization (Clerk session) with its venues
      description: |
        Requires a signed-in Clerk user with an active organization. The
        organization is the billing tenant: it owns the plan, the credit
        balance, and every venue listed here.
      responses:
        "200":
          description: Organization summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /org/billing/checkout:
    post:
      operationId: createOrgBillingCheckout
      tags: [organization]
      summary: Start Stripe Checkout for the caller's organization
      description: |
        Subscriptions (starter/growth) and one-off credit packs are purchased
        by the organization; credits land in the shared org balance via the
        Stripe webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Billing not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /org/billing/portal:
    post:
      operationId: createOrgBillingPortal
      tags: [organization]
      summary: Open the Stripe customer portal for the caller's organization
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPortalResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Billing not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /org/credit-history:
    get:
      operationId: getOrgCreditHistory
      tags: [organization]
      summary: Recent credit ledger entries for the caller's organization
      responses:
        "200":
          description: Ledger entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCreditHistoryResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/dashboard:
    get:
      operationId: getVenueDashboard
      tags: [venues]
      summary: Get venue dashboard (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueDashboardResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/stats:
    get:
      operationId: getVenueStats
      tags: [venues]
      summary: Get venue statistics
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Venue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueStatsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/media:
    get:
      operationId: listVenueMedia
      tags: [venues]
      summary: List venue media (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of venue media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVenueMediaResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: addVenueMedia
      tags: [venues]
      summary: Add a media item to the venue (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVenueMediaBody"
      responses:
        "201":
          description: Media added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueMediaItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/media/{mediaId}:
    delete:
      operationId: deleteVenueMedia
      tags: [venues]
      summary: Delete a venue media item (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Media not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new couple session for a venue
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created and processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: listVenueSessions
      tags: [sessions]
      summary: List all sessions for a venue (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by ID (owner-only, owner-session protected)
      description: Owner-only endpoint. Couples should use /sessions/by-token/{shareToken}.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSessionDetailResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a prospect gallery session (owner-only)
      description: |
        Owner-only. Permanently removes the session along with its couple
        photos and generated assets, both database rows and stored objects.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/by-token/{shareToken}:
    get:
      operationId: getSessionByToken
      tags: [sessions]
      summary: Get a session by share token (couple-facing public view)
      description: Public read-only access via unguessable share token. Never returns PII like coupleEmail.
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/recover:
    post:
      operationId: recoverSessions
      tags: [sessions]
      summary: Email magic recovery links for any sessions tied to this email
      description: |
        Cross-device recovery. To prevent email enumeration, this endpoint always
        returns 200 with the same generic response whether or not the email has
        sessions on file. If sessions exist, an email is sent with one-tap links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverSessionsBody"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverSessionsResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/{id}/send-email:
    post:
      operationId: sendSessionEmail
      tags: [sessions]
      summary: Email the gallery link to the couple (owner-only)
      description: Owner-only. Can override recipient. Use /sessions/by-token/{shareToken}/send-email for couple-driven sends.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSessionEmailBody"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendSessionEmailResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Gallery is not ready to email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/by-token/{shareToken}/send-email:
    post:
      operationId: sendSessionEmailByToken
      tags: [sessions]
      summary: Couple-driven send. Authorized by the unguessable share token.
      description: |
        Used by the couple from the result page. Recipient is constrained: it must
        match the email captured on the session OR the session must have no email
        on file yet (first-time capture). Override to arbitrary third-party emails
        is not allowed via this endpoint.
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSessionEmailByTokenBody"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendSessionEmailResponse"
        "400":
          description: Recipient not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Gallery is not ready to email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /gallery-styles:
    get:
      operationId: listGalleryStyles
      tags: [styles]
      summary: List available gallery styles
      responses:
        "200":
          description: List of gallery styles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGalleryStylesResponse"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
        - name: shareToken
          in: query
          required: false
          description: Required to read generated gallery assets from a public share page.
          schema:
            type: string
        - name: venueSlug
          in: query
          required: false
          description: Required to read venue media from the public couple preview for that venue.
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/overview:
    get:
      operationId: getControlOverview
      tags: [control-plane]
      summary: Operator cockpit — live KPIs, agent fleet, and queue counts
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlOverviewResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a control-plane operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/agents/{key}/run:
    post:
      operationId: runControlAgent
      tags: [control-plane]
      summary: Trigger an agent run immediately
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRunStartedResponse"
        "404":
          description: Unknown agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Another run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/agents/{key}/status:
    post:
      operationId: setControlAgentStatus
      tags: [control-plane]
      summary: Pause or resume an agent
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlAgentStatusBody"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAgentResponse"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unknown agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/runs:
    get:
      operationId: listControlRuns
      tags: [control-plane]
      summary: Recent agent runs
      parameters:
        - name: agentKey
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRunsResponse"

  /control/runs/{id}:
    get:
      operationId: getControlRun
      tags: [control-plane]
      summary: Full run detail including the tool-call transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRunDetailResponse"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/actions:
    get:
      operationId: listControlActions
      tags: [control-plane]
      summary: Governed actions (approval queue and history)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, executed, failed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlActionsResponse"

  /control/actions/{id}/decision:
    post:
      operationId: decideControlAction
      tags: [control-plane]
      summary: Approve (executes immediately) or reject a pending action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlActionDecisionBody"
      responses:
        "200":
          description: Decision recorded (and executed when approved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlActionResponse"
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Action is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/tasks:
    get:
      operationId: listControlTasks
      tags: [control-plane]
      summary: Agent-raised work items
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_progress, done, dismissed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlTasksResponse"

  /control/tasks/{id}/status:
    post:
      operationId: setControlTaskStatus
      tags: [control-plane]
      summary: Move a task through its lifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlTaskStatusBody"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlTaskResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /control/experiments:
    get:
      operationId: listControlExperiments
      tags: [control-plane]
      summary: Experiment portfolio
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Experiments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlExperimentsResponse"

  /control/audit:
    get:
      operationId: getControlAudit
      tags: [control-plane]
      summary: Immutable audit trail of agent, operator, and system events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAuditResponse"

  /control/policies:
    get:
      operationId: listControlPolicies
      tags: [control-plane]
      summary: Governance policy limits
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPoliciesResponse"

  /control/metrics/history:
    get:
      operationId: getControlMetricsHistory
      tags: [control-plane]
      summary: KPI snapshot history for trends
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlMetricsHistoryResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required: [env, database, storage, ai, billing, email, qualityGate, imageModel, ffmpeg]
          additionalProperties: false
          properties:
            env:
              $ref: "#/components/schemas/ReadinessCheckState"
            database:
              $ref: "#/components/schemas/ReadinessCheckState"
            storage:
              $ref: "#/components/schemas/ReadinessCheckState"
            ai:
              $ref: "#/components/schemas/ReadinessCheckState"
            billing:
              $ref: "#/components/schemas/ReadinessCheckState"
            email:
              $ref: "#/components/schemas/ReadinessCheckState"
            qualityGate:
              $ref: "#/components/schemas/ReadinessCheckState"
            imageModel:
              $ref: "#/components/schemas/ReadinessCheckState"
            ffmpeg:
              $ref: "#/components/schemas/ReadinessCheckState"

    ReadinessCheckState:
      type: string
      enum: [ok, degraded]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    CreateVenueBody:
      type: object
      required: [name, slug, ownerEmail]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9-]+$"
        tagline:
          type: string
        description:
          type: string
        ownerEmail:
          type: string
          format: email
          description: Email of the venue owner for secure login links and notifications.
        contactEmail:
          type: string
          format: email
          description: Optional public inquiry email shown to couples.
        contactPhone:
          type: string
          description: Optional public phone number shown to couples.
        websiteUrl:
          type: string
          format: uri
          description: Optional public venue website URL.
        bookingUrl:
          type: string
          format: uri
          description: Optional public tour booking URL.

    VenueResponse:
      type: object
      required: [id, name, slug, plan, creditsBalance, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        tagline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        ownerEmail:
          type: string
          format: email
          nullable: true
          description: Owner contact email (only returned on owner-session protected responses).
        contactEmail:
          type: string
          nullable: true
          description: Public inquiry email shown to couples.
        contactPhone:
          type: string
          nullable: true
          description: Public phone number shown to couples.
        websiteUrl:
          type: string
          nullable: true
          description: Public venue website URL.
        bookingUrl:
          type: string
          nullable: true
          description: Public tour booking URL.
        organizationId:
          type: integer
          nullable: true
          description: Billing organization that owns this venue.
        plan:
          type: string
          enum: [trial, starter, growth, none]
          description: Organization plan (billing lives on the organization).
        creditsBalance:
          type: integer
          description: Organization credit balance (shared across the org's venues).
        billingPeriodEnd:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    BillingCheckoutBody:
      type: object
      required: [product]
      properties:
        product:
          type: string
          enum: [starter, growth, credit_pack]

    BillingCheckoutResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

    BillingPortalResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

    UpdateVenueBody:
      type: object
      description: |
        All fields optional. Only the provided fields are updated.
        Slug is intentionally not editable to keep public URLs stable.
      properties:
        name:
          type: string
          minLength: 1
        tagline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        ownerEmail:
          type: string
          format: email
          description: Owner email for secure login links and notifications. Cannot be cleared.
        contactEmail:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        bookingUrl:
          type: string
          nullable: true

    RecoverOwnerBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    SimpleAcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean

    OrganizationResponse:
      type: object
      required: [organization, venues]
      properties:
        organization:
          type: object
          required: [id, name, plan, creditsBalance, clerkOrgId]
          properties:
            id:
              type: integer
            name:
              type: string
            plan:
              type: string
              enum: [trial, starter, growth, none]
            creditsBalance:
              type: integer
            billingPeriodEnd:
              type: string
              format: date-time
              nullable: true
            clerkOrgId:
              type: string
            role:
              type: string
              nullable: true
              description: Caller's Clerk role in this organization (e.g. org:admin).
            billingConfigured:
              type: boolean
              description: Whether Stripe billing is configured on this server.
        venues:
          type: array
          items:
            type: object
            required: [id, name, slug, createdAt]
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
              tagline:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time

    OrgCreditHistoryResponse:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            type: object
            required: [id, delta, reason, createdAt]
            properties:
              id:
                type: integer
              delta:
                type: integer
              reason:
                type: string
              venueId:
                type: integer
                nullable: true
              sessionId:
                type: integer
                nullable: true
              createdAt:
                type: string
                format: date-time

    VenuePublicResponse:
      type: object
      required: [id, name, slug, media, isReady]
      description: Couple-facing venue profile. Never exposes billing or credit balances.
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        tagline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
          description: Public inquiry email shown to couples.
        contactPhone:
          type: string
          nullable: true
          description: Public phone number shown to couples.
        websiteUrl:
          type: string
          nullable: true
          description: Public venue website URL.
        bookingUrl:
          type: string
          nullable: true
          description: Public tour booking URL.
        createdAt:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: "#/components/schemas/VenueMediaItem"
        isReady:
          type: boolean
          description: >-
            True when the venue has enough reference photography for couples to
            start a gallery (the server's session-create guard applies the same
            rule). Couple-facing surfaces must use this flag instead of
            counting media themselves.
        uploadToken:
          type: string
          description: Short-lived venue-scoped token required for couple photo upload URL requests.

    ListVenuesResponse:
      type: object
      required: [venues]
      properties:
        venues:
          type: array
          items:
            $ref: "#/components/schemas/VenueDirectoryItem"

    VenueDirectoryItem:
      type: object
      required: [id, name, slug, mediaCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        tagline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        mediaCount:
          type: integer
          description: Number of venue photos on file. Always >= 1 for listed venues.
        thumbnailObjectKey:
          type: string
          nullable: true

    VenueMediaItem:
      type: object
      required: [id, venueId, objectKey, coverage, displayOrder, createdAt]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        objectKey:
          type: string
        coverage:
          $ref: "#/components/schemas/VenueMediaCoverage"
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time

    VenueMediaCoverage:
      type: string
      enum: [exterior, ceremony, reception, detail, natural_light]
      description: Coverage role of the venue reference photo for scene-specific generation.

    ListVenueMediaResponse:
      type: object
      required: [media]
      properties:
        media:
          type: array
          items:
            $ref: "#/components/schemas/VenueMediaItem"

    AddVenueMediaBody:
      type: object
      required: [objectKey, coverage]
      properties:
        objectKey:
          type: string
        coverage:
          $ref: "#/components/schemas/VenueMediaCoverage"
        displayOrder:
          type: integer

    VenueDashboardResponse:
      type: object
      required: [venue, sessions]
      properties:
        venue:
          $ref: "#/components/schemas/VenueResponse"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"

    VenueStatsResponse:
      type: object
      required: [totalSessions, readySessions, processingSessions, failedSessions, avgCompletionSeconds, totalEstimatedCostUsd]
      properties:
        totalSessions:
          type: integer
        readySessions:
          type: integer
        processingSessions:
          type: integer
        failedSessions:
          type: integer
        avgCompletionSeconds:
          type: number
          nullable: true
        totalEstimatedCostUsd:
          type: number
          description: Sum of estimated USD costs across all sessions for this venue.

    CreateSessionBody:
      type: object
      required: [couplePhotoKeys, coupleEmail]
      properties:
        couplePhotoKeys:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
        styleId:
          type: string
          description: ID of the desired gallery style. If omitted, the default style is used.
        coupleName:
          type: string
          description: Name of the couple. Optional.
        coupleEmail:
          type: string
          format: email
          description: Required. Used for recovery emails and notifications.

    GalleryStyleSummary:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    ListGalleryStylesResponse:
      type: object
      required: [styles]
      properties:
        styles:
          type: array
          items:
            $ref: "#/components/schemas/GalleryStyleSummary"

    SessionResponse:
      type: object
      required: [id, venueId, status, shareToken, createdAt]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        status:
          type: string
          enum: [pending, processing, ready, failed]
        shareToken:
          type: string
          description: Unguessable token used by the couple to view and share the session. Treat this like a password.
        createdAt:
          type: string
          format: date-time

    SessionSummary:
      type: object
      required: [id, venueId, status, createdAt]
      properties:
        id:
          type: integer
        venueId:
          type: integer
        status:
          type: string
          enum: [pending, processing, ready, failed]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        thumbnailObjectKey:
          type: string
          nullable: true
        coupleName:
          type: string
          nullable: true
        coupleEmail:
          type: string
          nullable: true
        shareToken:
          type: string
          nullable: true
        estimatedCostUsd:
          type: number
          description: Estimated USD cost to generate this gallery.

    SendSessionEmailBody:
      type: object
      properties:
        email:
          type: string
          description: Override recipient email. Uses session coupleEmail if omitted. Owner-only.

    SendSessionEmailByTokenBody:
      type: object
      properties:
        email:
          type: string
          description: |
            Recipient email. Only honored when the session has no email on file
            yet (first-time capture) or when the value matches the email already
            captured on the session.

    SendSessionEmailResponse:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean

    DeleteSessionResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean

    RecoverSessionsBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email to look up. Server emails a magic-link list if sessions exist.

    RecoverSessionsResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: Always true for valid emails. Server intentionally does not reveal whether the email is on file.

    SessionDetailResponse:
      type: object
      required: [id, venueId, status, createdAt, generatedAssets]
      description: Public/couple-facing session view. Intentionally omits PII like coupleEmail.
      properties:
        id:
          type: integer
        venueId:
          type: integer
        status:
          type: string
          enum: [pending, processing, ready, failed]
        errorMessage:
          type: string
          nullable: true
        styleId:
          type: string
          nullable: true
        coupleName:
          type: string
          nullable: true
        hasCoupleEmail:
          type: boolean
          description: True if an email is on file. The email itself is never returned to non-owners.
        shareToken:
          type: string
          nullable: true
        estimatedCostUsd:
          type: number
          description: Estimated USD cost to generate this gallery.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        venue:
          $ref: "#/components/schemas/VenuePublicResponse"
        generatedAssets:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedAsset"

    OwnerSessionDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SessionDetailResponse"
        - type: object
          description: Owner-only session detail. Includes couple contact data for that venue owner.
          properties:
            coupleEmail:
              type: string
              nullable: true
              description: Couple email on file. Only returned from owner-session protected endpoints.

    GeneratedAsset:
      type: object
      required: [id, sessionId, objectKey, assetType, displayOrder]
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        objectKey:
          type: string
        assetType:
          type: string
          enum: [image, video]
          description: "image is one generated gallery still; video is the branded motion reel."
        displayOrder:
          type: integer
        generationModel:
          type: string
          nullable: true
          description: Image model that produced this still. Null for legacy assets and motion reels.
        generationAttempts:
          type: integer
          nullable: true
          description: Number of frame attempts before this asset passed generation and quality checks.
        venueReferenceIndexes:
          type: array
          nullable: true
          description: Indexes of venue reference photos selected for this generated still.
          items:
            type: integer
        qualityReport:
          type: object
          nullable: true
          additionalProperties: true
          description: Gallery quality judge output for this still when the quality gate is enabled.

    ListSessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"

    UploadUrlRequest:
      type: object
      required: [name, size, contentType, purpose, venueSlug]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 52428800
          description: Maximum upload size is 50MB.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        purpose:
          type: string
          enum: [couple, venue]
        venueSlug:
          type: string
          minLength: 1
        uploadToken:
          type: string
          description: Required for couple uploads. Venue media uploads use the owner session cookie instead.

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    BusinessMetrics:
      type: object
      description: Live business KPIs computed from production tables.
      required: [capturedAt, organizations, venues, sessions, credits, assets]
      properties:
        capturedAt:
          type: string
          format: date-time
        organizations:
          type: object
          required: [total, byPlan, totalCreditsBalance, lowCreditCount, paidCount]
          properties:
            total:
              type: integer
            byPlan:
              type: object
              additionalProperties:
                type: integer
            totalCreditsBalance:
              type: integer
            lowCreditCount:
              type: integer
            paidCount:
              type: integer
        venues:
          type: object
          required: [total, new7d, new30d, withMedia, withSessions, unadoptedLegacy, activationRate]
          properties:
            total:
              type: integer
            new7d:
              type: integer
            new30d:
              type: integer
            withMedia:
              type: integer
            withSessions:
              type: integer
            unadoptedLegacy:
              type: integer
            activationRate:
              type: number
              description: Percentage of venues with at least one session.
        sessions:
          type: object
          required: [total, byStatus, created7d, created30d, ready7d, failed7d, failureRate7d]
          properties:
            total:
              type: integer
            byStatus:
              type: object
              additionalProperties:
                type: integer
            created7d:
              type: integer
            created30d:
              type: integer
            ready7d:
              type: integer
            failed7d:
              type: integer
            failureRate7d:
              type: number
            avgCompletionMinutes7d:
              type: number
              nullable: true
        credits:
          type: object
          required: [granted30d, consumed30d, refunded30d, purchased30d, grantsByReason30d]
          properties:
            granted30d:
              type: integer
            consumed30d:
              type: integer
            refunded30d:
              type: integer
            purchased30d:
              type: integer
            grantsByReason30d:
              type: object
              additionalProperties:
                type: integer
        assets:
          type: object
          required: [generated7d]
          properties:
            generated7d:
              type: integer

    ControlAgent:
      type: object
      required: [key, name, domain, description, status, intervalMinutes]
      properties:
        key:
          type: string
        name:
          type: string
        domain:
          type: string
          enum: [growth, support, product, finance, experiments, sales, activation, governance]
        description:
          type: string
        status:
          type: string
          enum: [active, paused]
        intervalMinutes:
          type: integer
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastRunStatus:
          type: string
          nullable: true

    ControlOverviewResponse:
      type: object
      required: [operatorEmail, aiConfigured, model, metrics, agents, counts]
      properties:
        operatorEmail:
          type: string
        aiConfigured:
          type: boolean
        model:
          type: string
        metrics:
          $ref: "#/components/schemas/BusinessMetrics"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/ControlAgent"
        counts:
          type: object
          required: [pendingActions, openTasks, runningExperiments, runs24h]
          properties:
            pendingActions:
              type: integer
            openTasks:
              type: integer
            runningExperiments:
              type: integer
            runs24h:
              type: integer

    ControlAgentStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, paused]

    ControlAgentResponse:
      type: object
      required: [agent]
      properties:
        agent:
          $ref: "#/components/schemas/ControlAgent"

    ControlRun:
      type: object
      required: [id, agentKey, trigger, status, toolCallCount, startedAt]
      properties:
        id:
          type: integer
        agentKey:
          type: string
        trigger:
          type: string
          enum: [schedule, manual]
        status:
          type: string
          enum: [running, succeeded, failed]
        model:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        toolCallCount:
          type: integer
        promptTokens:
          type: integer
          nullable: true
        completionTokens:
          type: integer
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    ControlRunStartedResponse:
      type: object
      required: [run]
      properties:
        run:
          $ref: "#/components/schemas/ControlRun"

    ControlRunsResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ControlRun"

    ControlRunDetail:
      allOf:
        - $ref: "#/components/schemas/ControlRun"
        - type: object
          properties:
            transcript:
              type: array
              nullable: true
              items:
                type: object
                additionalProperties: true

    ControlRunDetailResponse:
      type: object
      required: [run]
      properties:
        run:
          $ref: "#/components/schemas/ControlRunDetail"

    ControlAction:
      type: object
      required: [id, agentKey, actionType, title, params, riskLevel, requiresApproval, status, createdAt]
      properties:
        id:
          type: integer
        agentKey:
          type: string
        runId:
          type: integer
          nullable: true
        actionType:
