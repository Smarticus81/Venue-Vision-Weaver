              properties:
                median: { type: number, nullable: true }
                p75: { type: number, nullable: true }
                n: { type: integer }
            firstGalleryWithin7d: { type: number, nullable: true }
            firstGalleryWithin14d: { type: number, nullable: true }
            byCohortWeek:
              type: array
              items:
                type: object
                required: [weekStart, orgs, photosReady, firstGallery, galleryViewed, secondGallery14d, paid, matured]
                properties:
                  weekStart: { type: string, format: date-time }
                  orgs: { type: integer }
                  photosReady: { type: integer }
                  firstGallery: { type: integer }
                  galleryViewed: { type: integer }
                  secondGallery14d: { type: integer }
                  paid: { type: integer }
                  matured: { type: boolean }
