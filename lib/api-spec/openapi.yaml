openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: venues
    description: Venue management
  - name: sessions
    description: Couple photo sessions
  - name: storage
    description: Object storage upload and serving endpoints
  - name: organization
    description: |
      Organization-level account and billing. Auth is a Clerk session; billing
      is Stripe at the organization level (subscriptions + credit packs), with
      credits granted by the Stripe webhook. One organization owns many venues.
  - name: control-plane
    description: |
      Autonomous Business Control Plane. A Grok-backed multi-agent operating
      system (prospecting, outreach, campaigns, support, product, finance,
      experiments, activation, governance) runs the business on a schedule;
      operators supervise it here: trigger/pause agents, approve or reject
      governed actions, record prospect outcomes, work agent tasks, and audit
      everything. Auth is a Clerk session whose email is in
      CONTROL_PLANE_OPERATOR_EMAILS.
  - name: styles
    description: Gallery style catalog.
  - name: public
    description: Unauthenticated site configuration.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: |
        Returns the coarse ok/degraded map for deploy monitors. The reasons
        behind each degraded check (`details`: missing env keys, tables, hosts)
        are only included for a signed-in control-plane operator or a caller
        presenting READINESS_DETAIL_TOKEN in the x-readiness-token header.
      parameters:
        - name: x-readiness-token
          in: header
          required: false
          description: Matches READINESS_DETAIL_TOKEN to receive `details`.
          schema:
            type: string
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /venues:
    post:
      operationId: createVenue
      tags: [venues]
      summary: Create a new venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueBody"
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get a venue by slug (public)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Venue found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePublicResponse"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateVenue
      tags: [venues]
      summary: Update venue profile (owner session)
      description: |
        Owner-only. Updates the public-facing venue profile fields. The slug
        cannot be changed (it is the public URL handle and would break QR codes
        and shared links). Owner email updates require an active owner session.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueBody"
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /org:
    get:
      operationId: getOrganization
      tags: [organization]
      summary: Get the caller's organization (Clerk session) with its venues
      description: |
        Requires a signed-in Clerk user with an active organization. The
        organization is the billing tenant: it owns the plan, the credit
        balance, and every venue listed here.
      responses:
        "200":
          description: Organization summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateOrganization
      tags: [organization]
      summary: Update organization preferences (aggregate-proof opt-in, contact email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationBody"
      responses:
        "200":
          description: Organization summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /org/billing/checkout:
    post:
      operationId: createOrgBillingCheckout
      tags: [organization]
      summary: Start Stripe Checkout for the caller's organization
      description: |
        Subscriptions (starter/growth) and one-off credit packs are purchased
        by the organization; credits land in the shared org balance via the
        Stripe webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutResponse"
        "400":
          description: Unknown product (code invalid_product)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization, or the caller is not an organization admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Organization already has a subscription; change plans in the portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutConflictResponse"
        "503":
          description: Billing not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /org/billing/portal:
    post:
      operationId: createOrgBillingPortal
      tags: [organization]
      summary: Open the Stripe customer portal for the caller's organization
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPortalResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Billing not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /org/credit-history:
    get:
      operationId: getOrgCreditHistory
      tags: [organization]
      summary: Recent credit ledger entries for the caller's organization
      responses:
        "200":
          description: Ledger entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCreditHistoryResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/dashboard:
    get:
      operationId: getVenueDashboard
      tags: [venues]
      summary: Get venue dashboard (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueDashboardResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/media:
    get:
      operationId: listVenueMedia
      tags: [venues]
      summary: List venue media (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of venue media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVenueMediaResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: addVenueMedia
      tags: [venues]
      summary: Add a media item to the venue (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVenueMediaBody"
      responses:
        "201":
          description: Media added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueMediaItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/media/{mediaId}:
    delete:
      operationId: deleteVenueMedia
      tags: [venues]
      summary: Delete a venue media item (owner session)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Media not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new couple session for a venue
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created and processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by ID (owner-only, owner-session protected)
      description: Owner-only endpoint. Couples should use /sessions/by-token/{shareToken}.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSessionDetailResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a prospect gallery session (owner-only)
      description: |
        Owner-only. Permanently removes the session along with its couple
        photos and generated assets, both database rows and stored objects.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/by-token/{shareToken}:
    get:
      operationId: getSessionByToken
      tags: [sessions]
      summary: Get a session by share token (couple-facing public view)
      description: Public read-only access via unguessable share token. Never returns PII like coupleEmail.
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/recover:
    post:
      operationId: recoverSessions
      tags: [sessions]
      summary: Email magic recovery links for any sessions tied to this email
      description: |
        Cross-device recovery. To prevent email enumeration, this endpoint always
        returns 200 with the same generic response whether or not the email has
        sessions on file. If sessions exist, an email is sent with one-tap links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverSessionsBody"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverSessionsResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/{id}/send-email:
    post:
      operationId: sendSessionEmail
      tags: [sessions]
      summary: Email the gallery link to the couple (owner-only)
      description: Owner-only. Can override recipient. Use /sessions/by-token/{shareToken}/send-email for couple-driven sends.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSessionEmailBody"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendSessionEmailResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Gallery is not ready to email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: >-
            The email could not be delivered (provider rejected the send or
            email is not configured). The error message states the cause so
            the owner can fix the sender configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sessions/by-token/{shareToken}/send-email:
    post:
      operationId: sendSessionEmailByToken
      tags: [sessions]
      summary: Couple-driven send. Authorized by the unguessable share token.
      description: |
        Used by the couple from the result page. Recipient is constrained: it must
        match the email captured on the session OR the session must have no email
        on file yet (first-time capture). Override to arbitrary third-party emails
        is not allowed via this endpoint.
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSessionEmailByTokenBody"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendSessionEmailResponse"
        "400":
          description: Recipient not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Gallery is not ready to email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The email could not be delivered right now (couple-facing message, no config detail).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /public/config:
    get:
      operationId: getPublicConfig
      tags: [public]
      summary: Published prices, trial terms, founding offer, proof mode and contact address for the public site
      description: No auth. Cached 60s. The same JSON is injected into the HTML shell as <meta name="dreemer-public-config">.
      responses:
        "200":
          description: Public config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"

  /sessions/by-token/{shareToken}/events:
    post:
      operationId: recordGalleryEvent
      tags: [sessions]
      summary: Record a share-page event (shared, cta_click) for the gallery funnel
      description: Public, rate-limited per IP. "viewed" is recorded server-side by GET /sessions/by-token and is rejected here.
      parameters:
        - { name: shareToken, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryEventBody"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryEventResponse"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/sessions/{id}/booked:
    post:
      operationId: setSessionBooked
      tags: [venues]
      summary: Venue marks a couple as booked (or undoes it)
      description: |
        Idempotent: marking an already-booked couple as booked (or an unbooked
        one as unbooked) returns the row unchanged and records no event. A
        change records a `booked`/`unbooked` gallery event and stamps
        couple_sessions.booked_at / booked_by. Any organization member may
        mark a booking.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSessionBookedBody"
      responses:
        "200":
          description: Updated summary row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Venue belongs to another organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue or session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Sample galleries cannot be booked (code sample_session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/media/import-website:
    post:
      operationId: importVenueWebsiteMedia
      tags: [venues]
      summary: Pull candidate space photos from the venue's own website into venue media (owner confirms/deletes afterwards)
      description: |
        Organization admins only. Fetches the homepage and up to two venue
        subpages through the SSRF-guarded fetcher, keeps at most five usable,
        distinct photos with suggested coverage roles, and stamps
        websiteImportedAt. A second import within ten minutes answers 429
        (code import_cooldown).
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportWebsiteMediaBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportWebsiteMediaResponse"
        "400":
          description: No website URL on file (code no_website_url) or invalid URL (code invalid_website_url)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Only organization admins can import photos (code org_admin_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Import already ran recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /venues/{slug}/sample-gallery:
    post:
      operationId: createSampleGallery
      tags: [venues]
      summary: Render a sample gallery of the demo couple at this venue (owner; no credit charged; kind = sample)
      description: |
        Queues a gallery of the demo couple (DEMO_COUPLE_DIR) at this venue.
        No credit is charged; the session is kind = sample, created_via =
        sample, never emailed and never counted in proof or KPIs. One sample
        may be in flight per venue, and a venue gets at most
        MAX_SAMPLES_PER_VENUE samples that did not fail.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Sample session created and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: >-
            The account cannot render a sample: trial_expired or
            insufficient_credits (a sample is free but needs a fundable account)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
